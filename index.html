    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 100vw;
            height: 100vh;
            background: #000;
            overflow: hidden;

            display: flex;
            justify-content: center;
            align-items: center;
        }

        #yazi {
            color: white;
            font-size: 30px;
            text-align: center;

            transition:
                color 1s ease,
                font-family 0.5s ease,
                font-size 1s ease,
                letter-spacing 1s ease,
                text-shadow 0.8s ease,
                transform 1s ease;
        }

        @keyframes giris {
            0% {
                opacity: 0;
                transform: scale(0.8);
                filter: blur(10px);
            }

            100% {
                opacity: 1;
                transform: scale(1);
                filter: blur(0);
            }
        }

        body::after {
            content: "";
            position: fixed;
            inset: 0;
            pointer-events: none;

            background:
                repeating-linear-gradient(
                    to bottom,
                    rgba(255,255,255,0.025) 0px,
                    rgba(255,255,255,0.025) 1px,
                    transparent 1px,
                    transparent 4px

        }

</head>
