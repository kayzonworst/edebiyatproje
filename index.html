<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acaba...</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #000;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            position: relative;
            font-family: Arial, sans-serif;
        }

        .yazi {
            position: absolute;
            color: white;
            font-size: 22px;
            font-weight: 300;
            letter-spacing: 1px;
            opacity: 0;
            animation: belirme 5s ease-in-out forwards;
            white-space: nowrap;
        }

        @keyframes belirme {
            0% {
                opacity: 0;
                transform: scale(0.95);
            }

            20% {
                opacity: 1;
            }

            70% {
                opacity: 1;
            }

            100% {
                opacity: 0;
                transform: scale(1.02);
            }
        }
    </style>
</head>

<body>

<script>

const yazilar = [
    "acaba beni düşünüyor mu ?",
    "acaba beni hatırlıyor mu ?",
    "acaba her zaman benden kurtulmak mı istiyordu ?",
    "acaba onun hayatındaki yerim neydi ?",
    "acaba benim hakkımda konuşuyor mu ?"
];

function yeniYazi() {

    const yazi = document.createElement("div");
    yazi.classList.add("yazi");

    yazi.innerText = yazilar[Math.floor(Math.random() * yazilar.length)];

    // Yazının ekranda taşmaması için konum hesabı
    const x = Math.random() * 80 + 5;
    const y = Math.random() * 85 + 5;

    yazi.style.left = x + "%";
    yazi.style.top = y + "%";

    // Her yazının boyutu biraz farklı olsun
    yazi.style.fontSize = (18 + Math.random() * 9) + "px";

    // Animasyon süresi biraz rastgele olsun
    yazi.style.animationDuration = (4 + Math.random() * 4) + "s";

    document.body.appendChild(yazi);

    // Animasyon bitince yazıyı sil
    setTimeout(() => {
        yazi.remove();
    }, 8000);
}

// İlk yazılar
for (let i = 0; i < 4; i++) {
    setTimeout(yeniYazi, i * 1200);
}

// Sürekli yeni yazılar oluştur
setInterval(yeniYazi, 1800);

</script>

</body>
</html>
